<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Editor background -->
  <rect width="800" height="600" fill="#faf7f2"/>
  
  <!-- Title bar -->
  <rect width="800" height="35" fill="#f5ede3"/>
  <text x="20" y="23" font-family="monospace" font-size="14" fill="#2d1b1f">Halloween Light Theme - example.ts</text>
  
  <!-- Line numbers background -->
  <rect x="0" y="35" width="60" height="565" fill="#f5ede3"/>
  
  <!-- Line numbers -->
  <text x="15" y="65" font-family="monospace" font-size="13" fill="#9ca3af">1</text>
  <text x="15" y="85" font-family="monospace" font-size="13" fill="#9ca3af">2</text>
  <text x="15" y="105" font-family="monospace" font-size="13" fill="#9ca3af">3</text>
  <text x="15" y="125" font-family="monospace" font-size="13" fill="#9ca3af">4</text>
  <text x="15" y="145" font-family="monospace" font-size="13" fill="#9ca3af">5</text>
  <text x="15" y="165" font-family="monospace" font-size="13" fill="#9ca3af">6</text>
  <text x="15" y="185" font-family="monospace" font-size="13" fill="#9ca3af">7</text>
  <text x="15" y="205" font-family="monospace" font-size="13" fill="#9ca3af">8</text>
  <text x="15" y="225" font-family="monospace" font-size="13" fill="#9ca3af">9</text>
  <text x="8" y="245" font-family="monospace" font-size="13" fill="#9ca3af">10</text>
  <text x="8" y="265" font-family="monospace" font-size="13" fill="#9ca3af">11</text>
  <text x="8" y="285" font-family="monospace" font-size="13" fill="#9ca3af">12</text>
  <text x="8" y="305" font-family="monospace" font-size="13" fill="#9ca3af">13</text>
  <text x="8" y="325" font-family="monospace" font-size="13" fill="#9ca3af">14</text>
  <text x="8" y="345" font-family="monospace" font-size="13" fill="#9ca3af">15</text>
  
  <!-- Code content -->
  <!-- Line 1: import -->
  <text x="75" y="65" font-family="monospace" font-size="13" fill="#d97706">import</text>
  <text x="135" y="65" font-family="monospace" font-size="13" fill="#2d1b1f"> { </text>
  <text x="165" y="65" font-family="monospace" font-size="13" fill="#7c3aed">User</text>
  <text x="205" y="65" font-family="monospace" font-size="13" fill="#2d1b1f"> } </text>
  <text x="235" y="65" font-family="monospace" font-size="13" fill="#d97706">from</text>
  <text x="280" y="65" font-family="monospace" font-size="13" fill="#059669"> './types'</text>
  <text x="360" y="65" font-family="monospace" font-size="13" fill="#2d1b1f">;</text>
  
  <!-- Line 2: blank -->
  
  <!-- Line 3: comment -->
  <text x="75" y="105" font-family="monospace" font-size="13" fill="#9ca3af">// Halloween-themed user greeting</text>
  
  <!-- Line 4: function declaration -->
  <text x="75" y="125" font-family="monospace" font-size="13" fill="#d97706">function</text>
  <text x="155" y="125" font-family="monospace" font-size="13" fill="#2563eb"> greetUser</text>
  <text x="245" y="125" font-family="monospace" font-size="13" fill="#2d1b1f">(</text>
  <text x="255" y="125" font-family="monospace" font-size="13" fill="#2d1b1f">user</text>
  <text x="295" y="125" font-family="monospace" font-size="13" fill="#5a4a4e">:</text>
  <text x="310" y="125" font-family="monospace" font-size="13" fill="#7c3aed"> User</text>
  <text x="355" y="125" font-family="monospace" font-size="13" fill="#2d1b1f">)</text>
  <text x="365" y="125" font-family="monospace" font-size="13" fill="#5a4a4e">:</text>
  <text x="380" y="125" font-family="monospace" font-size="13" fill="#7c3aed"> string</text>
  <text x="440" y="125" font-family="monospace" font-size="13" fill="#2d1b1f"> {</text>
  
  <!-- Line 5: const -->
  <text x="95" y="145" font-family="monospace" font-size="13" fill="#d97706">const</text>
  <text x="145" y="145" font-family="monospace" font-size="13" fill="#2d1b1f"> emoji </text>
  <text x="205" y="145" font-family="monospace" font-size="13" fill="#5a4a4e">=</text>
  <text x="220" y="145" font-family="monospace" font-size="13" fill="#059669"> '🎃'</text>
  <text x="265" y="145" font-family="monospace" font-size="13" fill="#2d1b1f">;</text>
  
  <!-- Line 6: const -->
  <text x="95" y="165" font-family="monospace" font-size="13" fill="#d97706">const</text>
  <text x="145" y="165" font-family="monospace" font-size="13" fill="#2d1b1f"> greeting </text>
  <text x="225" y="165" font-family="monospace" font-size="13" fill="#5a4a4e">=</text>
  <text x="240" y="165" font-family="monospace" font-size="13" fill="#059669"> 'Happy Halloween'</text>
  <text x="390" y="165" font-family="monospace" font-size="13" fill="#2d1b1f">;</text>
  
  <!-- Line 7: blank -->
  
  <!-- Line 8: if statement -->
  <text x="95" y="205" font-family="monospace" font-size="13" fill="#d97706">if</text>
  <text x="120" y="205" font-family="monospace" font-size="13" fill="#2d1b1f"> (</text>
  <text x="135" y="205" font-family="monospace" font-size="13" fill="#2d1b1f">user</text>
  <text x="175" y="205" font-family="monospace" font-size="13" fill="#5a4a4e">.</text>
  <text x="185" y="205" font-family="monospace" font-size="13" fill="#2d1b1f">isSpooky</text>
  <text x="265" y="205" font-family="monospace" font-size="13" fill="#2d1b1f">) {</text>
  
  <!-- Line 9: return -->
  <text x="115" y="225" font-family="monospace" font-size="13" fill="#d97706">return</text>
  <text x="175" y="225" font-family="monospace" font-size="13" fill="#2d1b1f"> `</text>
  <text x="190" y="225" font-family="monospace" font-size="13" fill="#059669">${emoji} ${greeting}, ${</text>
  <text x="410" y="225" font-family="monospace" font-size="13" fill="#2d1b1f">user</text>
  <text x="450" y="225" font-family="monospace" font-size="13" fill="#5a4a4e">.</text>
  <text x="460" y="225" font-family="monospace" font-size="13" fill="#2d1b1f">name</text>
  <text x="500" y="225" font-family="monospace" font-size="13" fill="#059669">}!</text>
  <text x="520" y="225" font-family="monospace" font-size="13" fill="#2d1b1f">`;</text>
  
  <!-- Line 10: } -->
  <text x="95" y="245" font-family="monospace" font-size="13" fill="#2d1b1f">}</text>
  
  <!-- Line 11: blank -->
  
  <!-- Line 12: return -->
  <text x="95" y="285" font-family="monospace" font-size="13" fill="#d97706">return</text>
  <text x="155" y="285" font-family="monospace" font-size="13" fill="#059669"> 'Boo!'</text>
  <text x="215" y="285" font-family="monospace" font-size="13" fill="#2d1b1f">;</text>
  
  <!-- Line 13: } -->
  <text x="75" y="305" font-family="monospace" font-size="13" fill="#2d1b1f">}</text>
  
  <!-- Line 14: blank -->
  
  <!-- Line 15: export -->
  <text x="75" y="345" font-family="monospace" font-size="13" fill="#d97706">export</text>
  <text x="135" y="345" font-family="monospace" font-size="13" fill="#d97706"> default</text>
  <text x="205" y="345" font-family="monospace" font-size="13" fill="#2d1b1f"> greetUser;</text>
  
  <!-- Status bar -->
  <rect x="0" y="565" width="800" height="35" fill="#ede0d4"/>
  <text x="20" y="587" font-family="monospace" font-size="12" fill="#d97706">● TypeScript</text>
  <text x="150" y="587" font-family="monospace" font-size="12" fill="#2d1b1f">UTF-8</text>
  <text x="220" y="587" font-family="monospace" font-size="12" fill="#2d1b1f">LF</text>
  <text x="270" y="587" font-family="monospace" font-size="12" fill="#2d1b1f">Ln 8, Col 15</text>
  
  <!-- Decorative pumpkin in corner -->
  <text x="750" y="590" font-size="20">🎃</text>
</svg>
