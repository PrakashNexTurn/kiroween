<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="64" fill="#0d0a0f"/>
  
  <!-- Pumpkin body -->
  <ellipse cx="64" cy="70" rx="38" ry="35" fill="#ff8c1a"/>
  
  <!-- Pumpkin segments -->
  <path d="M 64 35 Q 64 70 64 105" stroke="#d97706" stroke-width="2" fill="none"/>
  <path d="M 50 40 Q 52 70 54 100" stroke="#d97706" stroke-width="1.5" fill="none"/>
  <path d="M 78 40 Q 76 70 74 100" stroke="#d97706" stroke-width="1.5" fill="none"/>
  <path d="M 38 55 Q 42 70 46 95" stroke="#d97706" stroke-width="1" fill="none"/>
  <path d="M 90 55 Q 86 70 82 95" stroke="#d97706" stroke-width="1" fill="none"/>
  
  <!-- Stem -->
  <rect x="60" y="28" width="8" height="10" rx="2" fill="#10b981"/>
